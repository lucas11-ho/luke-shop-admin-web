name: Luke Shop Merchant Admin CI

on:
  push:
  pull_request:

concurrency:
  group: merchant-admin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest
    env:
      VITE_APP_ENV: production
      VITE_LUKE_SHOP_API_BASE_URL: https://api.example.invalid
      VITE_LUKE_SHOP_CUSTOMER_WEB_BASE_URL: https://shop.example.invalid
      VITE_LUKE_SHOP_STAFF_WEB_BASE_URL: https://staff.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Run source and release regressions
        run: npm run verify
      - name: Theme System v1 A2 merchant selection guard
        run: node scripts/v0.13.0-theme-system-v1-a2-regression-test.mjs
      - name: Theme System v1 A3 professional icon picker guard
        run: node scripts/v0.13.0-theme-system-v1-a3-regression-test.mjs
      - name: Theme Navigation Composer v1 A4 merchant guard
        run: node scripts/v0.13.0-theme-navigation-composer-v1-a4-regression-test.mjs
      - name: Theme Controls v1 A5 button/form merchant guard
        run: node scripts/v0.13.0-theme-controls-v1-a5-regression-test.mjs
      - name: Theme Product + Typography Composer v1 A6 merchant guard
        run: node scripts/v0.13.0-theme-product-typography-v1-a6-regression-test.mjs
      - name: Theme Commerce Surfaces v1 A7 merchant guard
        run: node scripts/v0.13.0-theme-commerce-surfaces-v1-a7-regression-test.mjs
      - name: Staff store access Admin regression
        run: node scripts/v0.13.0-staff-store-access-admin-v1-regression-test.mjs
      - name: Operations Separation v1.1 regression
        run: node scripts/v0.13.0-operations-separation-v1-1-regression-test.mjs
      - name: Build production bundle
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org/